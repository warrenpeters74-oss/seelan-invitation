<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body { font-family: Arial; padding:20px; background:#f5f5f5; }
.card { background:white; padding:20px; margin:10px; display:inline-block; width:200px; border-radius:8px; }
button { padding:8px 12px; margin:5px; }
input { padding:8px; margin:10px 0; width:300px; }
</style>
</head>

<body>

<h2>Seelan RSVP Dashboard</h2>

<div class="card">Total Guests<br><h2 id="total">0</h2></div>
<div class="card">Attending<br><h2 id="yes">0</h2></div>
<div class="card">Declined<br><h2 id="no">0</h2></div>
<div class="card">Total Count<br><h2 id="count">0</h2></div>

<br><br>

<input type="text" id="search" placeholder="Search guest..." onkeyup="filterGuests()">

<br>

<button onclick="loadData()">Refresh Data</button>
<button onclick="sendBulk()">Send All Invites</button>
<button onclick="sendReminders()">Remind Pending</button>

<br><br>

<table border="1" cellpadding="8" id="table">
<thead>
<tr>
<th>Name</th>
<th>Status</th>
<th>Guests</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

const baseURL = "https://warrenpeters74-oss.github.io/seelan-invitation/rsvp.html?name=";

// 👉 SAMPLE DATA (REPLACE LATER WITH GOOGLE SHEET API)
let data = [];

function loadData() {

fetch("https://script.google.com/macros/s/AKfycbx4MS1iuIbqpfh5_M2Ja6GPWsP7fBHTPLKfQ_wWejIV2N_drqQqeIi7sDU8bBaJWPmkCw/exec")
.then(res => res.json())
.then(res => {

data = res;

let tbody = document.querySelector("#table tbody");
tbody.innerHTML = "";

let total = 0, yes = 0, no = 0, count = 0;

res.forEach(r => {

total++;

if (r.attending === "Yes") {
  yes++;
  count += Number(r.guests);
} else if (r.attending === "No") {
  no++;
}

let row = `
<tr>
<td>${r.name}</td>
<td>${r.attending || "Pending"}</td>
<td>${r.guests || 0}</td>
<td>
<button onclick="sendInvite('${r.name}')">Invite</button>
<button onclick="sendReminder('${r.name}')">Remind</button>
</td>
</tr>
`;

tbody.innerHTML += row;

});

document.getElementById("total").innerText = total;
document.getElementById("yes").innerText = yes;
document.getElementById("no").innerText = no;
document.getElementById("count").innerText = count;

});
}

function sendInvite(name) {
let link = baseURL + encodeURIComponent(name);
window.open(`https://wa.me/?text=Dear ${name}, you are invited. RSVP here: ${link}`);
}

function sendReminder(name) {
let link = baseURL + encodeURIComponent(name);
window.open(`https://wa.me/?text=Reminder: Please RSVP here ${link}`);
}

function sendBulk() {
alert("Send manually for now or we automate next");
}

function sendReminders() {
alert("Next step: automate pending only");
}

function filterGuests() {
let search = document.getElementById("search").value.toLowerCase();
let rows = document.querySelectorAll("tbody tr");

rows.forEach(row => {
row.style.display = row.innerText.toLowerCase().includes(search) ? "" : "none";
});
}

</script>

</body>
</html>
