<!DOCTYPE html>
<html>
<head>
  <title>Seelan RSVP Admin Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    h2 {
      color: #2C3E50;
    }

    .card {
      display: inline-block;
      padding: 15px;
      margin: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      min-width: 150px;
      text-align: center;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }

    th {
      background: #2C3E50;
      color: white;
    }
  </style>
</head>

<body>

  <h2>RSVP Dashboard</h2>

  <!-- SUMMARY CARDS -->
  <div class="card">Total<br><b id="total">0</b></div>
  <div class="card">Attending<br><b id="yes">0</b></div>
  <div class="card">Declined<br><b id="no">0</b></div>
  <div class="card">Pending<br><b id="pending">0</b></div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Guests</th>
        <th>Checked In</th>
      </tr>
    </thead>
    <tbody id="guestList"></tbody>
  </table>

  <script>

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4MS1iuIbqpfh5_M2Ja6GPWsP7fBHTPLKfQ_wWejIV2N_drqQqeIi7sDU8bBaJWPmkCw/exec";

    async function loadDashboard() {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();

      let total = data.length;
      let yes = data.filter(x => x.attending === "Yes").length;
      let no = data.filter(x => x.attending === "No").length;
      let pending = total - (yes + no);

      document.getElementById("total").innerText = total;
      document.getElementById("yes").innerText = yes;
      document.getElementById("no").innerText = no;
      document.getElementById("pending").innerText = pending;

      let table = document.getElementById("guestList");
      table.innerHTML = "";

      data.forEach(g => {
        table.innerHTML += `
          <tr>
            <td>${g.name}</td>
            <td>${g.attending}</td>
            <td>${g.guests}</td>
            <td>${g.checkedIn || ""}</td>
          </tr>
        `;
      });
    }

    window.onload = loadDashboard;

  </script>

</body>
</html>
