<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>16th Day Prayer RSVP</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap");

    :root {
      --navy: #071f4a;
      --gold: #a76d10;
      --cream: #fffdf8;
      --success: #235b44;
      --error: #832f2f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #faf6ee;
      color: var(--navy);
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    button, textarea { font: inherit; }

    .site {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 10px 8px 32px;
    }

    .page-one img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--gold);
      box-shadow: 0 8px 22px rgba(57, 38, 8, 0.14);
    }

    .page-two {
      position: relative;
      width: 100%;
      margin-top: 12px;
      aspect-ratio: 3 / 4;
      background: var(--cream);
      border: 1px solid var(--gold);
      box-shadow: 0 8px 22px rgba(57, 38, 8, 0.14);
      overflow: hidden;
      isolation: isolate;
    }

    .page-two-artwork {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }

    /* Live personalised greeting — the template image must be blank here. */
    .live-greeting {
      position: absolute;
      left: 41.0%;
      top: 23.15%;
      width: 52.2%;
      min-height: 4.8%;
      display: flex;
      align-items: center;
      padding: 0;
      background: transparent;
      color: var(--navy);
      font-size: 30px;
      font-weight: 600;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      visibility: hidden;
      z-index: 4;
    }

    .hit-button {
      position: absolute;
      cursor: pointer;
      border: 2px solid transparent;
      background: transparent;
      color: transparent;
      border-radius: 2px;
      z-index: 4;
    }

    .hit-button,
    .hit-button:hover,
    .hit-button:focus,
    .hit-button:focus-visible,
    .hit-button.active {
      border-color: transparent !important;
      outline: none !important;
      box-shadow: none !important;
      appearance: none;
      -webkit-appearance: none;
    }

    #yesButton {
      left: 7.7%;
      top: 53.0%;
      width: 41.0%;
      height: 7.5%;
    }

    #noButton {
      left: 51.7%;
      top: 53.0%;
      width: 40.5%;
      height: 7.5%;
    }

    .counter {
      position: absolute;
      left: 27.0%;
      top: 66.15%;
      width: 46.0%;
      height: 5.8%;
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      align-items: center;
      text-align: center;
      z-index: 4;
    }

    .counter button {
      width: clamp(30px, 7.6vw, 60px);
      aspect-ratio: 1;
      justify-self: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }

    .counter button,
    .counter button:hover,
    .counter button:focus,
    .counter button:focus-visible {
      outline: none !important;
      box-shadow: none !important;
      appearance: none;
      -webkit-appearance: none;
    }

    .counter button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .counter output {
      color: var(--navy);
      font-size: clamp(23px, 5.8vw, 48px);
      font-weight: 600;
      line-height: 1;
      transform: translateY(-12%);
    }

    .message-cover {
      position: absolute;
      left: 8.05%;
      top: 81.75%;
      width: 75.8%;
      height: 7.35%;
      background: var(--cream);
      border: 0;
      z-index: 3;
      pointer-events: none;
    }

    #message {
      position: absolute;
      left: 8.55%;
      top: 82.05%;
      width: 73.4%;
      height: 6.7%;
      resize: none;
      border: 0;
      background: transparent;
      color: var(--navy);
      padding: 0.7% 0.9%;
      font-size: clamp(12px, 2.45vw, 18px);
      line-height: 1.25;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      z-index: 4;
    }

    #message::placeholder { color: transparent; }
    #message:focus { box-shadow: none; }

    #submitButton {
      position: absolute;
      left: 8.1%;
      top: 91.25%;
      width: 83.8%;
      height: 5.6%;
      cursor: pointer;
      border: 0;
      background: transparent;
      color: transparent;
      z-index: 4;
    }

    #submitButton:focus-visible {
      outline: 3px solid rgba(7, 31, 74, 0.45);
      outline-offset: 2px;
    }

    #statusBox {
      position: absolute;
      left: 8.1%;
      bottom: 1.2%;
      width: 83.8%;
      min-height: 3.2%;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0.5% 1%;
      border: 1px solid;
      background: rgba(255,253,248,0.98);
      text-align: center;
      font-size: clamp(10px, 2.4vw, 18px);
      line-height: 1.15;
      z-index: 6;
    }

    #statusBox.show { display: flex; }
    #statusBox.success { color: var(--success); border-color: var(--success); }
    #statusBox.error { color: var(--error); border-color: var(--error); }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cream);
    }

    .loading-card {
      width: min(92vw, 420px);
      padding: 26px;
      border: 1px solid var(--gold);
      text-align: center;
      background: var(--cream);
      box-shadow: 0 12px 28px rgba(54,36,8,0.14);
    }

    .loading-card h2 { margin: 4px 0; font-size: 28px; }
    .loading-card p { margin: 0; font-size: 16px; }
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <div id="loading" class="loading">
    <div class="loading-card">
      <div style="font-size:38px;color:#a76d10">❦</div>
      <h2>Loading your invitation</h2>
      <p id="loadingText">Please wait while we retrieve your personalised details.</p>
    </div>
  </div>

  <main id="site" class="site hidden">
    <section class="page-one">
      <img src="seelan-invitation.jpg" alt="Seelan Moodley 16th Day Prayer invitation">
    </section>

    <section class="page-two" aria-label="Personalised RSVP form">
      <img
        class="page-two-artwork"
        src="rsvp-page-template.png"
        alt="RSVP confirmation page"
      >

      <div id="guestGreeting" class="live-greeting"></div>

      <button id="yesButton" class="hit-button" type="button" aria-label="Yes, we will attend"></button>
      <button id="noButton" class="hit-button" type="button" aria-label="No, we are not attending"></button>

      <div class="counter">
        <button id="minusButton" type="button" aria-label="Reduce number attending">−</button>
        <output id="guestCount" aria-live="polite">0</output>
        <button id="plusButton" type="button" aria-label="Increase number attending">+</button>
      </div>

      <div class="message-cover" aria-hidden="true"></div>
      <textarea id="message" maxlength="500" placeholder="" aria-label="Optional message"></textarea>

      <button id="submitButton" type="button" aria-label="Send my RSVP"></button>

      <div id="statusBox" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    "use strict";

    const SCRIPT_URL =
      "https://script.google.com/macros/s/" +
      "AKfycbx4MS1iuIbqpfh5_M2Ja6GPWsP7fBHTPLKfQ_" +
      "wWejIV2N_drqQqeIi7sDU8bBaJWPmkCw/exec";

    const params = new URLSearchParams(window.location.search);
    const guestId = String(params.get("id") || params.get("guestId") || "")
      .trim()
      .toUpperCase();

    let guestRecord = null;
    let attendanceChoice = "";
    let guestCount = 0;

    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");
    const site = document.getElementById("site");
    const guestGreeting = document.getElementById("guestGreeting");
    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");
    const minusButton = document.getElementById("minusButton");
    const plusButton = document.getElementById("plusButton");
    const guestCountOutput = document.getElementById("guestCount");
    const messageField = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const statusBox = document.getElementById("statusBox");

    function normaliseStatus(value) {
      const status = String(value || "").trim().toLowerCase();
      if (["yes", "accepted", "attending", "confirmed"].includes(status)) return "Yes";
      if (["no", "declined", "not attending"].includes(status)) return "No";
      return "Pending";
    }

    function displayName(name) {
      const clean = String(name || "Guest").trim();
      return /&\s*family$/i.test(clean) ? clean : `${clean} & Family`;
    }

    function safeInt(value, fallback = 0) {
      const parsed = Number.parseInt(value, 10);
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function fitGreeting() {
      const maxSize = Math.max(20, Math.min(32, window.innerWidth * 0.03));
      const minSize = 14;
      let size = maxSize;
      guestGreeting.style.fontSize = `${size}px`;

      while (guestGreeting.scrollWidth > guestGreeting.clientWidth && size > minSize) {
        size -= 0.5;
        guestGreeting.style.fontSize = `${size}px`;
      }
    }

    function showSite() {
      loading.classList.add("hidden");
      site.classList.remove("hidden");
    }

    function showFatal(message) {
      loadingText.textContent = message;
    }

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = `show ${type}`;
    }

    function clearStatus() {
      statusBox.textContent = "";
      statusBox.className = "";
    }

    function render() {
      yesButton.classList.toggle("active", attendanceChoice === "Yes");
      noButton.classList.toggle("active", attendanceChoice === "No");

      if (attendanceChoice === "No") guestCount = 0;
      if (attendanceChoice === "Yes" && guestCount < 1) guestCount = 1;

      guestCountOutput.textContent = String(guestCount);
      minusButton.disabled = attendanceChoice !== "Yes" || guestCount <= 1;
      plusButton.disabled = attendanceChoice !== "Yes";
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, {
        cache: "no-store",
        redirect: "follow",
        ...options
      });

      if (!response.ok) throw new Error(`Server returned ${response.status}.`);

      const responseText = await response.text();
      try {
        return JSON.parse(responseText);
      } catch {
        throw new Error("The server returned an invalid response.");
      }
    }

    function findGuest(records) {
      if (!Array.isArray(records)) return null;
      return records.find(row =>
        String(row.guestId || row.id || row["Guest ID"] || "")
          .trim()
          .toUpperCase() === guestId
      ) || null;
    }

    function extractGuest(data) {
      if (!data) return null;
      if (data.guest && typeof data.guest === "object") return data.guest;
      if (Array.isArray(data)) return findGuest(data);
      if (Array.isArray(data.guests)) return findGuest(data.guests);
      if (Array.isArray(data.data)) return findGuest(data.data);
      if (data.name || data.guestId || data.id) return data;
      return null;
    }

    async function loadGuest() {
      if (!guestId) {
        showFatal("This invitation link is incomplete.");
        return;
      }

      try {
        const data = await fetchJson(`${SCRIPT_URL}?_=${Date.now()}`);
        guestRecord = extractGuest(data);

        if (!guestRecord) {
          throw new Error(`No invitation record was found for ${guestId}.`);
        }

        guestGreeting.textContent = `Dear ${displayName(guestRecord.name)}`;
        fitGreeting();
        guestGreeting.style.visibility = "visible";

        const savedStatus = normaliseStatus(
          guestRecord.rsvpStatus || guestRecord.attending || guestRecord.status
        );

        if (savedStatus === "Yes") {
          attendanceChoice = "Yes";
          guestCount = Math.max(
            1,
            safeInt(
              guestRecord.confirmedGuests ||
              guestRecord.guests ||
              guestRecord.numberAttending,
              1
            )
          );
        } else if (savedStatus === "No") {
          attendanceChoice = "No";
          guestCount = 0;
        } else {
          attendanceChoice = "";
          guestCount = 0;
        }

        messageField.value = String(guestRecord.notes || guestRecord.message || "");
        render();
        showSite();
      } catch (error) {
        console.error(error);
        showFatal(error instanceof Error ? error.message : "The invitation could not be loaded.");
      }
    }

    async function submitRsvp() {
      clearStatus();

      if (!attendanceChoice) {
        showStatus("Please select whether you will be attending.", "error");
        return;
      }

      const confirmedGuests = attendanceChoice === "Yes" ? guestCount : 0;
      const note = messageField.value.trim();

      submitButton.disabled = true;

      const body = new URLSearchParams({
        action: "submitRSVP",
        guestId,
        id: guestId,
        rsvpStatus: attendanceChoice,
        attending: attendanceChoice,
        status: attendanceChoice,
        confirmedGuests: String(confirmedGuests),
        guests: String(confirmedGuests),
        numberAttending: String(confirmedGuests),
        notes: note,
        message: note
      });

      try {
        const data = await fetchJson(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body: body.toString()
        });

        if (data && data.success === false) {
          throw new Error(data.message || "The RSVP could not be saved.");
        }

        showStatus(
          attendanceChoice === "Yes"
            ? `Thank you. Attendance has been confirmed for ${guestCount} ${guestCount === 1 ? "person" : "people"}.`
            : "Thank you. Your response has been recorded.",
          "success"
        );
      } catch (error) {
        console.error(error);
        showStatus(
          error instanceof Error ? error.message : "The RSVP could not be saved.",
          "error"
        );
      } finally {
        submitButton.disabled = false;
      }
    }

    yesButton.addEventListener("click", () => {
      attendanceChoice = "Yes";
      if (guestCount < 1) guestCount = 1;
      clearStatus();
      render();
    });

    noButton.addEventListener("click", () => {
      attendanceChoice = "No";
      guestCount = 0;
      clearStatus();
      render();
    });

    minusButton.addEventListener("click", () => {
      if (attendanceChoice === "Yes" && guestCount > 1) {
        guestCount -= 1;
        render();
      }
    });

    plusButton.addEventListener("click", () => {
      if (attendanceChoice === "Yes") {
        guestCount += 1;
        render();
      }
    });

    submitButton.addEventListener("click", submitRsvp);
    window.addEventListener("resize", fitGreeting);

    loadGuest();
  </script>
</body>
</html>
