<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>16th Day Prayer Invitation</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap");
:root{--navy:#071f4a;--gold:#a76d10;--cream:#fffaf1;--success:#235b44;--error:#832f2f}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#faf6ee;color:var(--navy);font-family:"Cormorant Garamond",Georgia,serif}
button,textarea{font:inherit}
.site{width:min(100%,760px);margin:0 auto;padding:10px 8px 32px}
.art-page,.rsvp-page{position:relative;width:100%;margin-top:12px;overflow:hidden;isolation:isolate;border:1px solid var(--gold);box-shadow:0 8px 22px rgba(57,38,8,.14);background:var(--cream)}
.art-page:first-child{margin-top:0}
.art-page>img,.rsvp-artwork{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
.hidden{display:none!important}

/* ---------- INITIAL RSVP OVERLAYS ---------- */
.rsvp-page{aspect-ratio:3/4}
.rsvp-artwork{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0}
.live-greeting{position:absolute;left:41.2%;top:24.25%;width:47.5%;min-height:3.0%;display:flex;align-items:center;justify-content:flex-start;color:var(--navy);font-family:Georgia,"Times New Roman",serif;font-size:clamp(13px,2.15vw,20px);font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;visibility:hidden;z-index:4}
.hit-button{position:absolute;cursor:pointer;border:2px solid transparent;background:transparent;color:transparent;z-index:4}
#yesButton{left:7.6%;top:55.0%;width:38.2%;height:7.4%}
#noButton{left:49.7%;top:55.0%;width:39.7%;height:7.4%}
.counter{position:absolute;left:26%;top:68.85%;width:48%;height:7%;z-index:4}
.counter button{position:absolute;top:5%;width:18%;height:60%;border:0;background:transparent;color:transparent;cursor:pointer;z-index:6}
#minusButton{left:0}
#plusButton{right:0}
.counter output{position:absolute;left:50%;top:7%;width:18%;height:42%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:clamp(18px,4vw,32px);font-weight:600;line-height:1;background:transparent;z-index:5}
#messagePromptCover{position:absolute;left:10.15%;top:82.55%;width:67.2%;height:5.95%;background:#fffaf1;z-index:5;pointer-events:none}
#rsvpMessage{position:absolute;left:10.2%;top:82.55%;width:67%;height:5.9%;overflow-y:auto;border:0;background:transparent;color:var(--navy);padding:.55% .9%;font-family:Georgia,"Times New Roman",serif;font-size:clamp(10px,1.65vw,14px);font-weight:400;line-height:1.25;outline:none;white-space:pre-wrap;word-break:break-word;z-index:6}
#rsvpSubmit{position:absolute;left:7.7%;top:90.8%;width:82.2%;height:5.8%;cursor:pointer;border:0;background:transparent;color:transparent;z-index:5}

/* ---------- VENUE UPDATE OVERLAYS ---------- */
/* Coordinates are aligned to the current blank-box seelan-venue-update.png */
#accessCode{position:absolute;left:42.7%;top:54.9%;width:18.5%;height:4.0%;z-index:5;display:flex;align-items:center;justify-content:center;padding:0;background:transparent;color:var(--navy);font-family:Georgia,"Times New Roman",serif;font-size:clamp(10px,2vw,17px);font-weight:600;line-height:1;letter-spacing:.01em;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
#mapsButton{position:absolute;left:52.7%;top:42.8%;width:35.2%;height:4.4%;z-index:6;border:0;background:transparent;color:transparent;cursor:pointer}
#venueComments{position:absolute;left:7.9%;top:81.7%;width:84%;height:4.4%;z-index:6;resize:none;border:0;padding:.7% 1.1%;background:transparent;color:var(--navy);font-size:clamp(10px,2vw,17px);line-height:1.25;outline:none;overflow-y:auto}
#venueComments:focus{background:transparent;box-shadow:none;outline:none}
#ackButton{position:absolute;left:14.3%;top:90%;width:38.2%;height:4%;z-index:6;border:0;background:transparent;color:transparent;cursor:pointer}
#ackStatus{position:absolute;left:60.4%;top:90%;width:25.4%;height:4.6%;z-index:7;display:none;align-items:center;justify-content:center;padding:.4% .8%;text-align:center;color:var(--success);background:transparent;border:0;font-size:clamp(8px,1.5vw,13px);font-weight:600;line-height:1.05;pointer-events:none}
#ackStatus.show{display:flex}
#venueSubmit{position:absolute;left:35%;top:95.1%;width:29%;height:3.2%;z-index:6;border:0;background:transparent;color:transparent;cursor:pointer}

/* ---------- SHARED STATUS ---------- */
.status{margin:12px 0 0;display:none;align-items:center;justify-content:center;padding:12px 14px;border:1px solid;background:rgba(255,253,248,.98);text-align:center;font-size:16px;line-height:1.35}
.status.show{display:flex}.status.success{color:var(--success);border-color:var(--success)}.status.error{color:var(--error);border-color:var(--error)}
.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:var(--cream)}
.loading-card{width:min(92vw,420px);padding:26px;border:1px solid var(--gold);text-align:center;background:var(--cream);box-shadow:0 12px 28px rgba(54,36,8,.14)}
.loading-card h2{margin:4px 0 6px;font-size:28px}.loading-card p{margin:0;font-size:16px}
.mode-note{margin:12px 0 0;padding:14px;border:1px solid var(--gold);background:var(--cream);text-align:center;line-height:1.4}
@media(max-width:520px){.site{padding-left:4px;padding-right:4px}.status{font-size:14px}}
</style>
</head>
<body>
<div id="loading" class="loading"><div class="loading-card"><div style="font-size:38px;color:#a76d10">❦</div><h2>Loading your invitation</h2><p id="loadingText">Please wait while we retrieve your personalised details.</p></div></div>

<main id="site" class="site hidden">
  <!-- PAGE 1: CURRENT / UPDATED INVITATION -->
  <section class="art-page" aria-label="Updated 16th Day Prayer invitation">
    <img src="seelan-invitation.jpg?v=20260808" alt="Seelan Moodley 16th Day Prayer invitation with updated venue">
  </section>

  <!-- MODE A: INITIAL RSVP FOR PENDING/DECLINED GUESTS -->
  <section id="initialRsvpSection" class="rsvp-page hidden" aria-label="Personalised RSVP form">
    <img class="rsvp-artwork" src="rsvp-page-template.png?v=20260808" alt="RSVP confirmation page">
    <div id="guestGreeting" class="live-greeting"></div>
    <button id="yesButton" class="hit-button" type="button" aria-label="Yes, we will attend"></button>
    <button id="noButton" class="hit-button" type="button" aria-label="No, we are not attending"></button>
    <div class="counter">
      <button id="minusButton" type="button" aria-label="Reduce number attending">−</button>
      <output id="guestCount" aria-live="polite"></output>
      <button id="plusButton" type="button" aria-label="Increase number attending">+</button>
    </div>
    <div id="messagePromptCover" aria-hidden="true"></div>
    <div id="rsvpMessage" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Optional RSVP message" spellcheck="false"></div>
    <button id="rsvpSubmit" type="button" aria-label="Send my RSVP"></button>
  </section>

  <!-- MODE B: VENUE UPDATE FOR ACCEPTED GUESTS -->
  <section id="venueSection" class="art-page hidden" aria-label="Important venue update">
    <img src="seelan-venue-update.png?v=20260808" alt="Important venue update with access information">
    <div id="accessCode" aria-label="Your estate access code"></div>
    <button id="mapsButton" type="button" aria-label="Open the new venue in Google Maps">Open Maps</button>
    <textarea id="venueComments" maxlength="500" aria-label="Comments"></textarea>
    <button id="ackButton" type="button" aria-label="I have noted the change of venue">Acknowledge venue change</button>
    <div id="ackStatus" role="status" aria-live="polite">✓ Thank you! Your acknowledgement has been recorded.</div>
    <button id="venueSubmit" type="button" aria-label="Submit acknowledgement and comments">Submit</button>
  </section>

  <div id="statusBox" class="status" role="status" aria-live="polite"></div>
</main>

<script>
"use strict";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbx4MS1iuIbqpfh5_M2Ja6GPWsP7fBHTPLKfQ_wWejIV2N_drqQqeIi7sDU8bBaJWPmkCw/exec";
const MAPS_URL="https://maps.app.goo.gl/b9tPsaP6QeVCFarQ9?g_st=aw";
const params=new URLSearchParams(window.location.search);
const guestId=String(params.get("id")||params.get("guestId")||"").trim().toUpperCase();
const mode=String(params.get("mode")||"").trim().toLowerCase();

let guestRecord=null;
let attendanceChoice="";
let guestCount=0;
let acknowledged=false;
let isSubmitting=false;

const $=id=>document.getElementById(id);
const loading=$("loading"),loadingText=$("loadingText"),site=$("site"),initialRsvpSection=$("initialRsvpSection"),venueSection=$("venueSection"),statusBox=$("statusBox");
const guestGreeting=$("guestGreeting"),yesButton=$("yesButton"),noButton=$("noButton"),minusButton=$("minusButton"),plusButton=$("plusButton"),guestCountOutput=$("guestCount"),rsvpMessage=$("rsvpMessage"),rsvpSubmit=$("rsvpSubmit");
const accessCode=$("accessCode"),mapsButton=$("mapsButton"),venueComments=$("venueComments"),ackButton=$("ackButton"),ackStatus=$("ackStatus"),venueSubmit=$("venueSubmit");

function text(v){return String(v??"").trim()}
function normaliseStatus(v){const s=text(v).toLowerCase();if(["yes","accepted","attending","confirmed"].includes(s))return"Yes";if(["no","declined","not attending"].includes(s))return"No";return"Pending"}
function safeInt(v,f=0){const n=parseInt(v,10);return Number.isFinite(n)?n:f}
function displayName(name){const clean=text(name)||"Guest";return /&\s*family$/i.test(clean)?clean:`${clean} & Family`}
function showFatal(m){loadingText.textContent=m}
function showSite(){loading.classList.add("hidden");site.classList.remove("hidden")}
function showStatus(m,t){statusBox.textContent=m;statusBox.className=`status show ${t}`}
function clearStatus(){statusBox.textContent="";statusBox.className="status"}

async function fetchJson(url,options={}){
 const r=await fetch(url,{cache:"no-store",redirect:"follow",...options});
 if(!r.ok)throw new Error(`Server returned ${r.status}.`);
 const raw=await r.text();try{return JSON.parse(raw)}catch{throw new Error("The server returned an invalid response.")}
}

function fitGreeting(){
 guestGreeting.style.fontSize="";
 let size=Math.min(20,Math.max(13,window.innerWidth*.0215));
 guestGreeting.style.fontSize=`${size}px`;
 while(guestGreeting.scrollWidth>guestGreeting.clientWidth&&size>13){size-=.5;guestGreeting.style.fontSize=`${size}px`}
}

function renderRsvp(){
 yesButton.classList.toggle("active",attendanceChoice==="Yes");
 noButton.classList.toggle("active",attendanceChoice==="No");
 if(attendanceChoice==="No")guestCount=0;
 if(attendanceChoice==="Yes"&&guestCount<1)guestCount=1;
 guestCountOutput.textContent=attendanceChoice==="Yes"?String(guestCount):"";
 minusButton.disabled=guestCount<=0;
}

function showInitialRsvp(){
 venueSection.classList.add("hidden");
 initialRsvpSection.classList.remove("hidden");
 guestGreeting.textContent=`Dear ${displayName(guestRecord.name)}`;
 guestGreeting.style.visibility="visible";
 const saved=normaliseStatus(guestRecord.rsvpStatus);
 if(saved==="Yes"){attendanceChoice="Yes";guestCount=Math.max(1,safeInt(guestRecord.confirmedGuests,1))}
 else if(saved==="No"){attendanceChoice="No";guestCount=0}
 else{attendanceChoice="";guestCount=0}
 rsvpMessage.textContent="";
 renderRsvp();fitGreeting();
}

function setAcknowledged(value){
 acknowledged=Boolean(value);
 ackButton.setAttribute("aria-pressed",acknowledged?"true":"false");
 ackStatus.classList.toggle("show",acknowledged);
}

function showVenueUpdate(){
 initialRsvpSection.classList.add("hidden");
 venueSection.classList.remove("hidden");
 const code=text(guestRecord.estateEntryCode);
 accessCode.textContent=/^\d{8}$/.test(code)?code:"";
 setAcknowledged(false);
 venueComments.value="";
 if(!/^\d{8}$/.test(code)){
   showStatus("Your attendance is confirmed. Your estate access code has not yet been added. Please contact Shai on 076 588 2192 for assistance.","error");
 } else {
   clearStatus();
 }
}

async function reloadGuest(){
 const data=await fetchJson(`${SCRIPT_URL}?action=getGuest&id=${encodeURIComponent(guestId)}&_=${Date.now()}`);
 if(data&&data.success===false)throw new Error(data.message||`No invitation record was found for ${guestId}.`);
 guestRecord=data&&data.guest?data.guest:null;
 if(!guestRecord)throw new Error(`No invitation record was found for ${guestId}.`);
 return guestRecord;
}

async function loadGuest(){
 if(!guestId){showFatal("This invitation link is incomplete.");return}
 try{
  await reloadGuest();
  const status=normaliseStatus(guestRecord.rsvpStatus);

  if(mode==="rsvp"){
    showInitialRsvp();
  }else if(mode==="venue"){
    if(status!=="Yes"){
      showFatal("This venue-update link is only active for guests who have accepted the invitation.");
      return;
    }
    showVenueUpdate();
  }else{
    // Backwards compatibility for older links without an explicit mode.
    if(status==="Yes") showVenueUpdate();
    else showInitialRsvp();
  }

  showSite();
 }catch(e){console.error(e);showFatal(e instanceof Error?e.message:"The invitation could not be loaded.")}
}

async function submitRsvp(){
 if(isSubmitting)return;clearStatus();
 if(!attendanceChoice){showStatus("Please select whether you will be attending.","error");return}
 const confirmed=attendanceChoice==="Yes"?guestCount:0;
 const note=rsvpMessage.textContent.trim();
 isSubmitting=true;rsvpSubmit.disabled=true;showStatus("Submitting your RSVP…","success");
 const body=new URLSearchParams({action:"submitRSVP",guestId,id:guestId,rsvpStatus:attendanceChoice,attending:attendanceChoice,status:attendanceChoice,confirmedGuests:String(confirmed),guests:String(confirmed),numberAttending:String(confirmed),notes:note,message:note});
 try{
  const data=await fetchJson(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:body.toString()});
  if(data&&data.success===false)throw new Error(data.message||"The RSVP could not be saved.");
  if(attendanceChoice==="Yes"){
    showStatus(`Thank you. Attendance has been confirmed for ${guestCount} ${guestCount===1?"person":"people"}. A separate venue information message will follow with the updated venue details, estate access code and Google Maps link.`,"success");
    await reloadGuest();
  }else{
    showStatus("Thank you. Your response has been recorded.","success");
  }
 }catch(e){console.error(e);showStatus(e instanceof Error?e.message:"The RSVP could not be saved.","error")}
 finally{isSubmitting=false;rsvpSubmit.disabled=false}
}

async function submitVenueUpdate(){
 if(isSubmitting)return;clearStatus();
 if(!acknowledged){showStatus("Please click “I HAVE NOTED THE CHANGE OF VENUE” before submitting.","error");return}
 const commentText=venueComments.value.trim();
 isSubmitting=true;venueSubmit.disabled=true;ackButton.disabled=true;showStatus("Saving your acknowledgement…","success");
 const body=new URLSearchParams({action:"submitVenueUpdate",guestId,id:guestId,acknowledged:"Yes",venueUpdateAcknowledged:"Yes",comments:commentText,venueUpdateComments:commentText});
 try{
  const data=await fetchJson(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:body.toString()});
  if(data&&data.success===false)throw new Error(data.message||"The venue acknowledgement could not be saved.");
  setAcknowledged(true);
  showStatus(commentText?"Thank you. Your acknowledgement and comments have been recorded.":"Thank you. Your acknowledgement has been recorded.","success");
 }catch(e){console.error(e);showStatus(e instanceof Error?e.message:"The venue acknowledgement could not be saved.","error")}
 finally{isSubmitting=false;venueSubmit.disabled=false;ackButton.disabled=false}
}

yesButton.addEventListener("click",()=>{attendanceChoice="Yes";if(guestCount<1)guestCount=1;clearStatus();renderRsvp()});
noButton.addEventListener("click",()=>{attendanceChoice="No";guestCount=0;clearStatus();renderRsvp()});
minusButton.addEventListener("click",()=>{if(attendanceChoice==="Yes"&&guestCount>1){guestCount--;clearStatus();renderRsvp()}});
plusButton.addEventListener("click",()=>{attendanceChoice="Yes";guestCount=guestCount<1?1:guestCount+1;clearStatus();renderRsvp()});
rsvpMessage.addEventListener("input",()=>{if(rsvpMessage.textContent.length>500)rsvpMessage.textContent=rsvpMessage.textContent.slice(0,500)});
rsvpSubmit.addEventListener("click",submitRsvp);
mapsButton.addEventListener("click",()=>window.open(MAPS_URL,"_blank","noopener,noreferrer"));
ackButton.addEventListener("click",()=>{clearStatus();setAcknowledged(true);showStatus("Venue change noted. Please click Submit below to save your acknowledgement.","success")});
venueSubmit.addEventListener("click",submitVenueUpdate);
window.addEventListener("resize",fitGreeting);
loadGuest();
</script>
</body>
</html>
