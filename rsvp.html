<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>16th Day Prayer – Venue Update</title>

  <style>
    :root {
      --navy: #071f4a;
      --gold: #a76d10;
      --cream: #fffaf1;
      --success: #235b44;
      --error: #832f2f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #faf6ee;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
    }

    button, textarea { font: inherit; }

    .site {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 10px 8px 32px;
    }

    .art-page {
      position: relative;
      width: 100%;
      margin-top: 12px;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid var(--gold);
      box-shadow: 0 8px 22px rgba(57, 38, 8, 0.14);
      background: var(--cream);
    }

    .art-page:first-child { margin-top: 0; }

    .art-page > img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      user-select: none;
    }

    /* PAGE 2 LIVE OVERLAYS
       The final artwork contains a sample access code and visual controls.
       These live controls sit over those areas so every guest receives
       their own Sheet-driven code and real interactive fields/buttons. */

    #accessCode {
      position: absolute;
      left: 39.2%;
      top: 50.7%;
      width: 20.3%;
      height: 4.7%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1%;
      border-radius: 0;
      background: transparent;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(14px, 3.1vw, 29px);
      line-height: 1;
      letter-spacing: 0.03em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    #mapsButton {
      position: absolute;
      left: 54.1%;
      top: 40.5%;
      width: 34.3%;
      height: 4.2%;
      z-index: 6;
      border: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #mapsButton:focus-visible,
    #ackButton:focus-visible,
    #submitButton:focus-visible {
      outline: 3px solid rgba(167,109,16,0.65);
      outline-offset: 2px;
    }

    #comments {
      position: absolute;
      left: 8.8%;
      top: 77.0%;
      width: 82.8%;
      height: 5.4%;
      z-index: 6;
      resize: none;
      border: 0;
      border-radius: 3px;
      padding: 1.0% 1.4%;
      background: transparent;
      color: var(--navy);
      font-size: clamp(11px, 2.3vw, 18px);
      line-height: 1.25;
      outline: none;
      overflow-y: auto;
    }

    #comments:focus {
      background: transparent;
      box-shadow: none;
    }

    #ackButton {
      position: absolute;
      left: 14.0%;
      top: 86.8%;
      width: 39.0%;
      height: 4.0%;
      z-index: 6;
      border: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #ackCover {display: none;
      position: absolute;
      left: 59.8%;
      top: 86.8%;
      width: 27.0%;
      height: 5.0%;
      z-index: 5;
      background: rgba(255,253,248,0.98);
      border-radius: 4px;
      pointer-events: none;
    }

    #ackStatus {
      position: absolute;
      left: 59.8%;
      top: 86.8%;
      width: 27.0%;
      height: 5.0%;
      z-index: 7;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0.6% 1%;
      text-align: center;
      color: var(--success);
      background: rgba(255,253,248,0.98);
      border: 1px solid rgba(35,91,68,0.45);
      border-radius: 4px;
      font-size: clamp(9px, 1.9vw, 15px);
      line-height: 1.1;
      pointer-events: none;
    }

    #ackStatus.show { display: flex; }

    #submitButton {
      position: absolute;
      left: 35.0%;
      top: 92.8%;
      width: 27.0%;
      height: 3.4%;
      z-index: 6;
      border: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #statusBox {
      margin: 12px 0 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      border: 1px solid;
      background: rgba(255,253,248,0.98);
      text-align: center;
      font-size: 16px;
      line-height: 1.35;
    }

    #statusBox.show { display: flex; }
    #statusBox.success { color: var(--success); border-color: var(--success); }
    #statusBox.error { color: var(--error); border-color: var(--error); }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cream);
    }

    .loading-card {
      width: min(92vw, 420px);
      padding: 26px;
      border: 1px solid var(--gold);
      text-align: center;
      background: var(--cream);
      box-shadow: 0 12px 28px rgba(54,36,8,0.14);
    }

    .loading-card h2 { margin: 4px 0 6px; font-size: 28px; }
    .loading-card p { margin: 0; font-size: 16px; }
    .hidden { display: none !important; }

    @media (max-width: 520px) {
      .site { padding-left: 4px; padding-right: 4px; }
      #statusBox { font-size: 14px; }
    }
  
    #ackCover { display: none !important; }
  
    #ackStatus { display: none !important; }
  </style>
</head>

<body>
  <div id="loading" class="loading">
    <div class="loading-card">
      <div style="font-size:38px;color:#a76d10">❦</div>
      <h2>Loading your invitation</h2>
      <p id="loadingText">Please wait while we retrieve your personalised venue details.</p>
    </div>
  </div>

  <main id="site" class="site hidden">
    <!-- LOCKED PAGE 1 IMAGE -->
    <section class="art-page" aria-label="Updated 16th Day Prayer invitation">
      <img
        src="seelan-invitation-venue-update.png?v=20260807"
        alt="Seelan Moodley 16th Day Prayer invitation with updated venue"
      >
    </section>

    <!-- LOCKED PAGE 2 IMAGE -->
    <section id="venuePage" class="art-page" aria-label="Important venue update">
      <img
        src="seelan-venue-update.png?v=20260807"
        alt="Important venue update with access information"
      >

      <!-- Live personalised 8-digit code from the Google Sheet -->
      <div id="accessCode" aria-label="Your estate access code">--------</div>

      <!-- Clickable Google Maps area -->
      <button
        id="mapsButton"
        type="button"
        aria-label="Open the new venue in Google Maps"
        title="Open the new venue in Google Maps"
      >Open Maps</button>

      <!-- Real editable comments field; placeholder disappears while typing -->
      <textarea
        id="comments"
        maxlength="500"
        aria-label="Comments"
      ></textarea>

      <!-- Real acknowledgement control over the artwork button -->
      <button
        id="ackButton"
        type="button"
        aria-label="I have noted the change of venue"
      >Acknowledge venue change</button>

      <!-- Covers the artwork's pre-rendered thank-you box until acknowledgement -->
      <div id="ackCover" aria-hidden="true"></div>
      <div id="ackStatus" role="status" aria-live="polite">
        ✓ Thank you! Your acknowledgement has been recorded.
      </div>

      <!-- Real submit control over the artwork submit button -->
      <button
        id="submitButton"
        type="button"
        aria-label="Submit acknowledgement and comments"
      >Submit</button>
    </section>

    <div id="statusBox" role="status" aria-live="polite"></div>
  </main>

  <script>
    "use strict";

    const SCRIPT_URL =
      "https://script.google.com/macros/s/" +
      "AKfycbx4MS1iuIbqpfh5_M2Ja6GPWsP7fBHTPLKfQ_" +
      "wWejIV2N_drqQqeIi7sDU8bBaJWPmkCw/exec";

    const MAPS_URL = "https://maps.app.goo.gl/b9tPsaP6QeVCFarQ9?g_st=aw";

    const params = new URLSearchParams(window.location.search);
    const guestId = String(params.get("id") || params.get("guestId") || "")
      .trim()
      .toUpperCase();

    let guestRecord = null;
    let acknowledged = false;
    let isSubmitting = false;

    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");
    const site = document.getElementById("site");
    const accessCode = document.getElementById("accessCode");
    const mapsButton = document.getElementById("mapsButton");
    const comments = document.getElementById("comments");
    const ackButton = document.getElementById("ackButton");
    const ackCover = document.getElementById("ackCover");
    const ackStatus = document.getElementById("ackStatus");
    const submitButton = document.getElementById("submitButton");
    const statusBox = document.getElementById("statusBox");

    function text(value) {
      return String(value ?? "").trim();
    }

    function yes(value) {
      return ["yes", "true", "acknowledged", "sent"].includes(text(value).toLowerCase());
    }

    function showSite() {
      loading.classList.add("hidden");
      site.classList.remove("hidden");
    }

    function showFatal(message) {
      loadingText.textContent = message;
    }

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = `show ${type}`;
    }

    function clearStatus() {
      statusBox.textContent = "";
      statusBox.className = "";
    }

    function setAcknowledged(value) {
      acknowledged = Boolean(value);
      ackButton.setAttribute("aria-pressed", acknowledged ? "true" : "false");

      if (acknowledged) {
        
        ackStatus.classList.add("show");
      } else {
        
        ackStatus.classList.remove("show");
      }
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, {
        cache: "no-store",
        redirect: "follow",
        ...options
      });

      if (!response.ok) {
        throw new Error(`Server returned ${response.status}.`);
      }

      const raw = await response.text();

      try {
        return JSON.parse(raw);
      } catch {
        throw new Error("The server returned an invalid response.");
      }
    }

    async function loadGuest() {
      if (!guestId) {
        showFatal("This invitation link is incomplete.");
        return;
      }

      try {
        const data = await fetchJson(
          `${SCRIPT_URL}?action=getGuest&id=${encodeURIComponent(guestId)}&_=${Date.now()}`
        );

        if (data && data.success === false) {
          throw new Error(data.message || `No invitation record was found for ${guestId}.`);
        }

        guestRecord = data && data.guest ? data.guest : null;

        if (!guestRecord) {
          throw new Error(`No invitation record was found for ${guestId}.`);
        }

        /* The venue update is intended for guests who previously accepted. */
        if (text(guestRecord.rsvpStatus).toLowerCase() !== "yes") {
          throw new Error("This venue-update link is not active for this invitation.");
        }

        const code = text(guestRecord.estateEntryCode);

        if (!/^\d{8}$/.test(code)) {
          throw new Error(
            "Your 8-digit estate access code is not available yet. Please contact Shai for assistance."
          );
        }

        accessCode.textContent = code;

        /* If the guest already acknowledged previously, restore that state. */
        setAcknowledged(yes(guestRecord.venueUpdateAcknowledged));

        /* Do not pre-fill previously submitted comments into the editable field. */
        comments.value = "";

        showSite();
      } catch (error) {
        console.error(error);
        showFatal(
          error instanceof Error
            ? error.message
            : "The invitation could not be loaded."
        );
      }
    }

    mapsButton.addEventListener("click", () => {
      window.open(MAPS_URL, "_blank", "noopener,noreferrer");
    });

    ackButton.addEventListener("click", () => {
      clearStatus();
      setAcknowledged(true);
      showStatus(
        "Venue change noted. Please click Submit below to save your acknowledgement.",
        "success"
      );
    });

    async function submitVenueUpdate() {
      if (isSubmitting) return;

      clearStatus();

      if (!acknowledged) {
        showStatus(
          "Please click “I HAVE NOTED THE CHANGE OF VENUE” before submitting.",
          "error"
        );
        return;
      }

      const commentText = comments.value.trim();

      isSubmitting = true;
      submitButton.disabled = true;
      ackButton.disabled = true;

      showStatus("Saving your acknowledgement…", "success");

      const body = new URLSearchParams({
        action: "submitVenueUpdate",
        guestId,
        id: guestId,
        acknowledged: "Yes",
        venueUpdateAcknowledged: "Yes",
        comments: commentText,
        venueUpdateComments: commentText
      });

      try {
        const data = await fetchJson(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body: body.toString()
        });

        if (data && data.success === false) {
          throw new Error(data.message || "The venue acknowledgement could not be saved.");
        }

        setAcknowledged(true);

        showStatus(
          commentText
            ? "Thank you. Your acknowledgement and comments have been recorded."
            : "Thank you. Your acknowledgement has been recorded.",
          "success"
        );
      } catch (error) {
        console.error(error);
        showStatus(
          error instanceof Error
            ? error.message
            : "The venue acknowledgement could not be saved.",
          "error"
        );
      } finally {
        isSubmitting = false;
        submitButton.disabled = false;
        ackButton.disabled = false;
      }
    }
submitButton.addEventListener("click", submitVenueUpdate);

    loadGuest();
  </script>
</body>
</html>
